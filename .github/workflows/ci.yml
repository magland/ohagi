# The type check and the test suite, on Node 24, the version the image runs.
#
# ohagi compiles mochiforge's and arewehuman's sources in with its own, so
# every job checks out the three repositories side by side, as they sit on a
# developer's disk. Their refs are `main` unless the dispatch names others: a
# change to the shared modules reaches ohagi's next run without a release in
# between.
#
# The tests compile documents, so the runner gets a small TeX Live: enough
# for pdflatex and latexmk, and poppler for reading the PDFs back. bubblewrap
# cannot make its namespace on these runners, so the tests that need it skip
# and the rest run without it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mochiforge-ref:
        description: mochiforge branch, tag, or commit to build against
        default: main
      arewehuman-ref:
        description: arewehuman branch, tag, or commit to build against
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: ohagi

      - uses: actions/checkout@v4
        with:
          repository: magland/mochiforge
          ref: ${{ inputs.mochiforge-ref || 'main' }}
          path: mochiforge

      - uses: actions/checkout@v4
        with:
          repository: magland/arewehuman
          ref: ${{ inputs.arewehuman-ref || 'main' }}
          path: arewehuman

      - name: Install TeX
        timeout-minutes: 8
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ohagi/package-lock.json

      - run: npm ci
        working-directory: ohagi

      # mochiforge and arewehuman have no node_modules here, and their sources
      # find packages by walking up from their src, which reaches the checkout
      # root and never ohagi/node_modules. The link puts ohagi's packages there, as the
      # Dockerfile does, so a package the shared modules need and ohagi does
      # not declare fails here rather than in the image.
      - run: ln -s ohagi/node_modules node_modules

      - run: npm run typecheck
        working-directory: ohagi

      - run: npm run build
        working-directory: ohagi

      - run: npm test
        working-directory: ohagi
