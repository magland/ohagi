# The type check and the test suite, on every Node the package claims to
# support.
#
# ohagi compiles mochiforge's sources in with its own, so every job checks out
# both repositories side by side, as they sit on a developer's disk. The
# mochiforge ref is `main` unless the dispatch names another: a change to the
# shared modules reaches ohagi's next run without a release in between.
#
# The tests compile documents, so the runner gets a small TeX Live: enough
# for pdflatex and latexmk, and poppler for reading the PDFs back. bubblewrap
# cannot make its namespace on these runners, so the tests that need it skip
# and the rest run without it.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      mochiforge-ref:
        description: mochiforge branch, tag, or commit to build against
        default: main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          path: ohagi

      - uses: actions/checkout@v4
        with:
          repository: magland/mochiforge
          ref: ${{ inputs.mochiforge-ref || 'main' }}
          path: mochiforge

      - name: Install TeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends latexmk texlive-latex-base texlive-latex-recommended texlive-fonts-recommended poppler-utils

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ohagi/package-lock.json

      - run: npm ci
        working-directory: ohagi

      # mochiforge has no node_modules here, and its sources find packages by
      # walking up from mochiforge/src, which reaches the checkout root and
      # never ohagi/node_modules. The link puts ohagi's packages there, as the
      # Dockerfile does, so a package the shared modules need and ohagi does
      # not declare fails here rather than in the image.
      - run: ln -s ohagi/node_modules node_modules

      - run: npm run typecheck
        working-directory: ohagi

      - run: npm run build
        working-directory: ohagi

      - run: npm test
        working-directory: ohagi
